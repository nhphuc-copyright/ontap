<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">✦</div><div class="brand-text"><span class="brand-kicker">BỘ ĐỀ ÔN TẬP</span><span class="brand-name">Tin học · Bài 1–9</span></div></div>
    <div class="top-right">
      <div class="overall-wrap"><div class="overall-label"><span>Tiến độ tổng</span><strong id="overallText">0 / 84</strong></div><div class="track"><span id="overallBar"></span></div></div>
      <button class="text-button" id="resetAll" type="button" title="Xóa toàn bộ tiến độ">Đặt lại</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-heading"><span class="side-title">NỘI DUNG ÔN TẬP</span><span class="side-count">09 BÀI</span></div>
      <nav class="lesson-list" id="lessonList" aria-label="Chọn bài"></nav>
      <div class="side-bottom"><strong id="sideProgress">0 / 84 câu đã làm</strong><p>Chọn một bài để bắt đầu ôn tập.</p><div class="track"><span id="sideBar"></span></div></div>
    </aside>
    <main class="main">
      <nav class="mobile-lessons" id="mobileLessons" aria-label="Chọn bài"></nav>
      <section class="hero" id="hero"></section>
      <section class="progress-card">
        <div class="progress-top"><strong>Tiến độ bài này</strong><span class="progress-detail" id="lessonProgressText">0 / 11 câu đã làm</span></div>
        <div class="track"><span id="lessonProgressBar"></span></div>
      </section>
      <div id="quizContent"></div>
      <div id="completionArea"></div>
    </main>
  </div>
  <div class="footer">Nội dung câu hỏi và đáp án được lấy từ bộ dữ liệu ôn tập bạn cung cấp.</div>

const $ = (selector) => document.querySelector(selector);
const state = {
  lessonIndex: 0,
  answers: DATA.bai.map(() => ({})),
  view: 'lesson',
  retryItems: [],
  retryAnswers: {}
};
const LETTERS = ['A','B','C','D'];
const TOTAL = DATA.bai.reduce((sum, lesson) => sum + lesson.trac_nghiem.length + lesson.dung_sai.y.length, 0);
const escapeText = (value) => String(value ?? '');
function node(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined && text !== null) el.textContent = text;
  return el;
}
function button(text, className, onClick, disabled=false) {
  const el = node('button', className, text);
  el.type = 'button';
  el.disabled = disabled;
  if (onClick) el.addEventListener('click', onClick);
  return el;
}
function lessonTotal(lesson) { return lesson.trac_nghiem.length + lesson.dung_sai.y.length; }
function lessonAnswerMap(index) { return state.answers[index]; }
function lessonCounts(index) {
  const lesson = DATA.bai[index], map = lessonAnswerMap(index);
  const total = lessonTotal(lesson);
  const entries = Object.values(map);
  return { total, answered: entries.length, correct: entries.filter(x => x.correct).length };
}
function overallCounts() {
  let answered=0, correct=0;
  DATA.bai.forEach((_,i) => { const c=lessonCounts(i); answered+=c.answered; correct+=c.correct; });
  return {answered,correct,total:TOTAL};
}
function refreshOverall() {
  const c=overallCounts(), pct=c.total ? c.answered/c.total*100 : 0;
  $('#overallText').textContent=`${c.answered} / ${c.total}`;
  $('#overallBar').style.width=`${pct}%`;
  $('#sideProgress').textContent=`${c.answered} / ${c.total} câu đã làm`;
  $('#sideBar').style.width=`${pct}%`;
  renderNav();
}
function renderNav() {
  const desktop=$('#lessonList'), mobile=$('#mobileLessons');
  desktop.replaceChildren(); mobile.replaceChildren();
  DATA.bai.forEach((lesson,index)=>{
    const c=lessonCounts(index), pct=c.total ? c.answered/c.total*100 : 0;
    const item=button('',`lesson-link ${index===state.lessonIndex?'active':''}`,()=>selectLesson(index));
    const num=node('span','lesson-num',String(lesson.so).padStart(2,'0'));
    const copy=node('span','lesson-copy');
    copy.append(node('span','lesson-name',lesson.tieu_de),node('span','lesson-meta',`${c.answered}/${c.total} câu đã làm`));
    item.append(num,copy);
    if(c.answered===c.total && c.total>0) item.append(node('span','lesson-tick','✓'));
    desktop.append(item);
    const chip=button(`Bài ${lesson.so}`,`mobile-chip ${index===state.lessonIndex?'active':''}`,()=>selectLesson(index));
    mobile.append(chip);
  });
}
function selectLesson(index) {
  state.lessonIndex=index; state.view='lesson'; state.retryItems=[]; state.retryAnswers={};
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function makeHero() {
  const lesson=DATA.bai[state.lessonIndex], c=lessonCounts(state.lessonIndex);
  $('#hero').replaceChildren();
  const content=node('div','hero-content');
  content.append(node('div','hero-eyebrow',`CHỦ ĐỀ ${String(lesson.so).padStart(2,'0')} · ÔN TẬP TIN HỌC`));
  content.append(node('h1','',lesson.tieu_de));
  content.append(node('p','', 'Chọn đáp án cho từng câu hỏi. Kết quả đúng/sai sẽ xuất hiện ngay sau khi bạn trả lời.'));
  const pills=node('div','hero-stats');
  pills.append(node('span','hero-pill',`${lesson.trac_nghiem.length} câu trắc nghiệm`),node('span','hero-pill',`${lesson.dung_sai.y.length} ý đúng / sai`),node('span','hero-pill',`${c.total} lượt trả lời`));
  content.append(pills); $('#hero').append(content);
}
function setLessonProgress() {
  const c=lessonCounts(state.lessonIndex), pct=c.total?c.answered/c.total*100:0;
  $('#lessonProgressText').textContent=`${c.answered} / ${c.total} câu đã làm`;
  $('#lessonProgressBar').style.width=`${pct}%`;
}
function answerNote(correct, correctText) {
  const box=node('div',`answer-note ${correct?'good':'bad'}`);
  box.append(node('span','answer-icon',correct?'✓':'!'));
  box.append(node('span','',correct?'Chính xác!':`Chưa chính xác. Đáp án đúng: ${correctText}`));
  return box;
}
function renderMultipleChoice(question, questionIndex, mode='lesson', retryKey=null) {
  const card=node('article','question-card');
  const map=mode==='lesson'?lessonAnswerMap(state.lessonIndex):state.retryAnswers;
  const key=mode==='lesson'?`mc:${questionIndex}`:retryKey;
  const saved=map[key];
  const top=node('div','q-top');
  top.append(node('span','q-number',`C${question.cau ?? questionIndex+1}`),node('span','q-type','Trắc nghiệm'));
  card.append(top,node('p','q-prompt',question.cau_hoi));
  const options=node('div','options');
  LETTERS.forEach(letter=>{
    const choice=button('',`option ${saved && letter===question.dap_an?'correct':''}${saved && saved.selected===letter && !saved.correct?' wrong':''}`,()=>{
      if(map[key]) return;
      map[key]={selected:letter,correct:letter===question.dap_an};
      rerenderKeepingPosition();
    },!!saved);
    choice.append(node('span','option-letter',letter),node('span','option-text',escapeText(question[letter])));
    if(saved && letter===question.dap_an) choice.classList.add('correct');
    if(saved && saved.selected===letter && !saved.correct) choice.classList.add('wrong');
    options.append(choice);
  });
  card.append(options);
  if(saved) card.append(answerNote(saved.correct,`${question.dap_an}. ${question[question.dap_an]}`));
  return card;
}
function renderTrueFalseRow(statement, index, mode='lesson', retryKey=null) {
  const wrap=node('div','tf-row');
  const map=mode==='lesson'?lessonAnswerMap(state.lessonIndex):state.retryAnswers;
  const key=mode==='lesson'?`tf:${index}`:retryKey;
  const saved=map[key];
  const expected=String(statement.dap_an).toLowerCase()==='đúng';
  const line=node('div','tf-row-top');
  line.append(node('span','tf-letter',statement.y || String.fromCharCode(97+index)),node('div','tf-statement',statement.noi_dung));
  wrap.append(line);
  const controls=node('div','tf-actions');
  [true,false].forEach(value=>{
    const label=value?'Đúng':'Sai';
    const isCorrect=value===expected;
    const selected=saved && saved.selected===value;
    let cls='tf-choice';
    if(saved && isCorrect) cls+=' correct-answer';
    if(saved && selected && !saved.correct) cls+=' selected-wrong';
    if(saved && selected && saved.correct) cls+=' selected-correct';
    controls.append(button(label,cls,()=>{
      if(map[key]) return;
      map[key]={selected:value,correct:isCorrect};
      rerenderKeepingPosition();
    },!!saved));
  });
  wrap.append(controls);
  if(saved){
    const note=node('div',`tf-note ${saved.correct?'good':'bad'}`,saved.correct?'✓ Chính xác!':`✕ Chưa đúng. Đáp án: ${expected?'Đúng':'Sai'}.`);
    wrap.append(note);
  }
  return wrap;
}
function renderTrueFalseGroup(lesson, mode='lesson', retryItem=null) {
  const card=node('article','question-card');
  const top=node('div','q-top');
  top.append(node('span','q-number',mode==='lesson'?'Đ/S':'ÔN'),node('span','q-type','Đúng / Sai'));
  card.append(top);
  if(mode==='lesson'){
    const intro=node('div','tf-intro'); intro.append(node('strong','','Câu dẫn'),node('span','',lesson.dung_sai.cau_dan)); card.append(intro);
    lesson.dung_sai.y.forEach((statement,index)=>card.append(renderTrueFalseRow(statement,index,'lesson')));
  }else{
    const intro=node('div','tf-intro'); intro.append(node('strong','','Câu dẫn'),node('span','',retryItem.cauDan || '')); card.append(intro);
    const statement={...retryItem.statement,y:retryItem.statement.y};
    card.append(renderTrueFalseRow(statement,retryItem.yIndex,'retry',retryItem.key));
  }
  return card;
}
function buildWrongItems(index) {
  const lesson=DATA.bai[index], map=lessonAnswerMap(index), items=[];
  lesson.trac_nghiem.forEach((q,i)=>{const saved=map[`mc:${i}`];if(saved && !saved.correct)items.push({type:'mc',key:`retry-mc:${i}`,question:q,questionIndex:i});});
  lesson.dung_sai.y.forEach((statement,i)=>{const saved=map[`tf:${i}`];if(saved && !saved.correct)items.push({type:'tf',key:`retry-tf:${i}`,statement,yIndex:i,cauDan:lesson.dung_sai.cau_dan});});
  return items;
}
function buildRetryFromRemaining() {
  state.retryItems=state.retryItems.filter(item=>!state.retryAnswers[item.key]?.correct);
  state.retryAnswers={};
  if(!state.retryItems.length){state.view='retryDone';}
}
function renderCompletion({retry=false}={}) {
  const area=$('#completionArea'); area.replaceChildren();
  const lesson=DATA.bai[state.lessonIndex];
  if(retry){
    const total=state.retryItems.length, map=state.retryAnswers;
    const answered=Object.keys(map).length, correct=Object.values(map).filter(x=>x.correct).length;
    if(answered<total) return;
    const wrong=state.retryItems.filter(item=>!map[item.key]?.correct).length;
    const box=node('section','completion');
    const head=node('div','completion-top'); head.append(node('div','completion-mark',wrong?'↻':'✓'));
    const title=node('div'); title.append(node('h3','',wrong?'Vẫn còn một vài câu cần ôn':'Bạn đã ôn đúng toàn bộ!'),node('p','',wrong?`Bạn đã làm đúng ${correct}/${total}. Có ${wrong} câu/ý cần thử lại.`:'Phần câu hỏi đã sai ở lượt trước đã được hoàn thành.')); head.append(title);box.append(head);
    const scores=node('div','score-row');scores.append(node('span','score-chip',`${correct}/${total} trả lời đúng`),node('span','score-chip',`${wrong} câu/ý còn sai`));box.append(scores);
    const actions=node('div','actions');
    if(wrong) actions.append(button('Ôn lại câu/ý còn sai','btn btn-primary',()=>{buildRetryFromRemaining();render();window.scrollTo({top:0,behavior:'smooth'});}));
    actions.append(button('Quay lại bài học','btn btn-secondary',()=>{state.view='lesson';state.retryItems=[];state.retryAnswers={};render();window.scrollTo({top:0,behavior:'smooth'});}));
    actions.append(button('Làm lại bài này','btn btn-quiet',()=>restartLesson()));box.append(actions);area.append(box);return;
  }
  const counts=lessonCounts(state.lessonIndex);
  if(counts.answered<counts.total)return;
  const wrong=buildWrongItems(state.lessonIndex);
  const box=node('section','completion');
  const head=node('div','completion-top');head.append(node('div','completion-mark',wrong.length?'✓':'★'));
  const title=node('div');title.append(node('h3','',wrong.length?'Đã hoàn thành bài học!':'Xuất sắc! Bạn đã đúng tất cả.'),node('p','',wrong.length?`Bạn đã trả lời đúng ${counts.correct}/${counts.total}. Hãy ôn thêm những câu/ý chưa đúng nhé.`:'Bạn đã hoàn thành bài này mà không có câu trả lời sai.'));head.append(title);box.append(head);
  const scores=node('div','score-row');scores.append(node('span','score-chip',`${counts.correct}/${counts.total} trả lời đúng`),node('span','score-chip',`${wrong.length} câu/ý cần ôn`));box.append(scores);
  const actions=node('div','actions');
  if(wrong.length)actions.append(button(`Làm lại ${wrong.length} câu/ý sai`,'btn btn-primary',()=>startRetry(wrong)));
  actions.append(button('Làm lại bài này','btn btn-secondary',()=>restartLesson()));
  if(state.lessonIndex<DATA.bai.length-1)actions.append(button('Sang bài tiếp theo →','btn btn-quiet',()=>selectLesson(state.lessonIndex+1)));
  box.append(actions);area.append(box);
}
function startRetry(items) {
  state.view='retry';state.retryItems=items.map(item=>({...item}));state.retryAnswers={};render();window.scrollTo({top:0,behavior:'smooth'});
}
function restartLesson() {
  state.answers[state.lessonIndex]={};state.view='lesson';state.retryItems=[];state.retryAnswers={};render();window.scrollTo({top:0,behavior:'smooth'});
}
function renderRetry() {
  const lesson=DATA.bai[state.lessonIndex], content=$('#quizContent');content.replaceChildren();
  const heading=node('div','section-heading');heading.append(node('div','section-icon','↻'),node('h2','','Ôn lại câu/ý đã sai'),node('span','',`${state.retryItems.length} câu/ý`));content.append(heading);
  const intro=node('div','tf-intro','Các câu/ý dưới đây được lấy từ những phần bạn đã trả lời chưa chính xác. Chọn lại đáp án để kiểm tra ngay.');content.append(intro);
  state.retryItems.forEach(item=>{
    if(item.type==='mc')content.append(renderMultipleChoice(item.question,item.questionIndex,'retry',item.key));
    else content.append(renderTrueFalseGroup(lesson,'retry',item));
  });
  renderCompletion({retry:true});
  const total=state.retryItems.length, answered=Object.keys(state.retryAnswers).length;
  $('#lessonProgressText').textContent=`${answered} / ${total} câu/ý đã ôn`;
  $('#lessonProgressBar').style.width=`${total?answered/total*100:0}%`;
}
function renderLesson() {
  const lesson=DATA.bai[state.lessonIndex],content=$('#quizContent');content.replaceChildren();
  const mcHeading=node('div','section-heading');mcHeading.append(node('div','section-icon','A'),node('h2','','Phần A · Trắc nghiệm'),node('span','',`${lesson.trac_nghiem.length} câu`));content.append(mcHeading);
  lesson.trac_nghiem.forEach((q,i)=>content.append(renderMultipleChoice(q,i)));
  const tfHeading=node('div','section-heading');tfHeading.append(node('div','section-icon','B'),node('h2','','Phần B · Đúng / Sai'),node('span','',`${lesson.dung_sai.y.length} ý`));content.append(tfHeading);
  content.append(renderTrueFalseGroup(lesson));
  renderCompletion();
  setLessonProgress();
}
function render() {
  makeHero();
  if(state.view==='retry')renderRetry();
  else if(state.view==='retryDone'){
    $('#quizContent').replaceChildren();renderCompletion({retry:true});
  }else renderLesson();
  refreshOverall();
  if(state.view==='retry'){
    const total=state.retryItems.length,answered=Object.keys(state.retryAnswers).length;
    $('#lessonProgressText').textContent=`${answered} / ${total} câu/ý đã ôn`;
    $('#lessonProgressBar').style.width=`${total?answered/total*100:0}%`;
  }
}
function rerenderKeepingPosition(){
  const y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}));
}
$('#resetAll').addEventListener('click',()=>{
  if(!confirm('Bạn có chắc muốn xóa toàn bộ kết quả đã làm ở cả 9 bài?'))return;
  state.answers=DATA.bai.map(()=>({}));state.view='lesson';state.retryItems=[];state.retryAnswers={};render();window.scrollTo({top:0,behavior:'smooth'});
});
render();
</script>
