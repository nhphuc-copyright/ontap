<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Practice – Grade 12</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/mammoth@1.9.0/mammoth.browser.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">English Practice</a>
    <span>GRADE 12 · MID-TERM REVISION</span>
  </header>

  <main class="container">
    <section class="intro">
      <p class="eyebrow">LUYỆN TẬP TIẾNG ANH 12</p>
      <h1>Revision Tests</h1>
      <p>6 đề ôn tập · 40 câu mỗi đề · Chấm điểm tức thì</p>
    </section>

    <div id="status" class="status">Đang tải dữ liệu đề thi...</div>

    <nav id="test-list" class="test-list"></nav>

    <section id="quiz" hidden>
      <div class="quiz-heading">
        <div>
          <p class="eyebrow" id="test-label">TEST 1</p>
          <h2 id="test-title">Practice test</h2>
        </div>
        <button id="reset-button" class="secondary">Làm lại</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-info">
          <span id="progress-text">0/40 câu đã trả lời</span>
          <span id="score-text">0 điểm</span>
        </div>
        <div class="progress-track">
          <div id="progress-bar"></div>
        </div>
      </div>

      <div id="questions"></div>

      <div class="finish-area">
        <button id="submit-button" class="primary">Nộp bài và xem kết quả</button>
        <div id="result" hidden></div>
      </div>
    </section>
  </main>

  <footer>English Practice · Grade 12</footer>

  <script src="answer-key.js"></script>
  <script src="app.js"></script>
</body>
</html>
